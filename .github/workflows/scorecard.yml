# OpenSSF Scorecard: supply-chain security checks, published for the README badge.
# Based on GitHub's starter workflow (actions/starter-workflows code-scanning/scorecard.yml),
# with every action pinned to a full commit SHA.

name: Scorecard supply-chain security
on:
  # Branch-Protection check runs on the default branch only.
  branch_protection_rule:
  # Keeps the Maintained check fresh.
  schedule:
    - cron: "29 4 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

# Default permissions are read-only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results only works from the default branch.
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      # Upload results to the code-scanning dashboard.
      security-events: write
      # Publish results and enable the badge.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The Branch-Protection check needs a read-admin token in a SCORECARD_TOKEN
          # secret on public repos; without it that check is reported as inconclusive.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
