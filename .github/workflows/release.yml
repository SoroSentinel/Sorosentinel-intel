# Attaches prebuilt binaries and SHA256SUMS to a GitHub release (Intel #56).
#
# Runs when a release is published, or by hand for an existing tag. Uses only
# the actions ci.yml already pins plus the gh CLI on the runner, so it adds no
# dependency. Signing and provenance attestations are not here yet: they need
# a new action, which is a separate decision.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to
        required: true

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            dir="sorosentinel-intel_${TAG}_${os}_${arch}"
            mkdir -p "dist/$dir"
            for cmd in intel-api intel-worker intel-ingest; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -buildid=" -o "dist/$dir/$cmd" "./cmd/$cmd"
            done
            cp LICENSE README.md "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Upload to the release
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
