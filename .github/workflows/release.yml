# Attaches prebuilt binaries and SHA256SUMS to a GitHub release (Intel #56).
#
# Runs when a release is published, or by hand for an existing tag. Uses the
# actions ci.yml already pins, the gh CLI on the runner, and
# actions/attest-build-provenance (approved 2026-11-02) to sign a SLSA build
# provenance attestation over every archive. Verify a download with:
#   gh attestation verify <archive> --repo SoroSentinel/Sorosentinel-intel
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to
        required: true

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation on GitHub
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag ancestry
        run: |
          set -eu
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          git fetch origin main
          git merge-base --is-ancestor "$TAG" origin/main || {
            echo "Error: Tag $TAG is not an ancestor of origin/main" >&2
            exit 1
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            dir="sorosentinel-intel_${TAG}_${os}_${arch}"
            mkdir -p "dist/$dir"
            for cmd in intel-api intel-worker intel-ingest; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -buildid=" -o "dist/$dir/$cmd" "./cmd/$cmd"
            done
            cp LICENSE README.md "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eu
          cp "$BUNDLE" "dist/sorosentinel-intel_${TAG}.sigstore.json"
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS "dist/sorosentinel-intel_${TAG}.sigstore.json" \
            --clobber --repo "$GITHUB_REPOSITORY"
