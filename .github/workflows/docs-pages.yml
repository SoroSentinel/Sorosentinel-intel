# Publishes docs/site/ as the documentation site on GitHub Pages.
#
# Why a workflow instead of Pages' "deploy from branch": branch mode can only
# serve the repository root or /docs, and this site lives at docs/site/ so the
# PRD, ARCHITECTURE, the runbooks and the ADRs stay exactly where every
# existing link already points. The build runs the github-pages gem, which is
# the same toolchain branch mode would have run, and jekyll-theme-minimal is
# one of its bundled themes, so docs/site/_config.yml needs no Gemfile.
#
# One manual step: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until that is set, the deploy job fails with "Pages is not
# enabled" while the build job stays green. That failure is the signal to go
# set it, not a regression to work around.
name: docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

# Read-only checkout, write to Pages, and the OIDC identity the deployment
# job attests with. Nothing here reads a product secret or a signing key.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs/site
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
